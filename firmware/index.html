<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Coucou</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1A17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coucou">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0F1A17;--s1:#1A2A25;--s2:#27392F;--tx:#F2F0E8;--sb:#8DA399;--ac:#E3B04B;--on:#1A1407;--rd:#E5594B;--ln:rgba(255,255,255,.07);--nv:rgba(26,42,37,.82);--wood:#8A5A33;--wood2:#5A361B;--face:#F3E9D2;color-scheme:dark}
:root.l{--bg:#EDF1EC;--s1:#fff;--s2:#E1E8E0;--tx:#15211D;--sb:#586B62;--ac:#B27A0E;--on:#fff;--ln:rgba(0,0,0,.08);--nv:rgba(255,255,255,.82);color-scheme:light}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
p{margin:0}
#app{max-width:520px;margin:0 auto}
.scr{display:none;padding:calc(10px + env(safe-area-inset-top)) 16px 170px}
.scr.on{display:block;animation:in .42s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateX(calc(var(--d,1)*30px))}}
h1{font-size:34px;line-height:1.1;letter-spacing:-.02em;margin:22px 4px 16px}
h2{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:18px 0 8px}
.sub{color:var(--sb);max-width:30ch}
.gt{color:var(--sb);font-size:13px;margin:0 16px 7px}
.g{background:var(--s1);border-radius:16px;overflow:hidden;margin:0 0 22px;text-align:left}
.r{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:52px;border-top:1px solid var(--ln)}
.g>:first-child{border-top:0}
.r small{display:block;color:var(--sb);font-size:13px}
.r b{font-weight:500}
.r>b{min-width:3.6em}
.v{margin-left:auto;color:var(--sb);font-size:15px;white-space:nowrap;background:none;border:0;padding:0}
.r .v[data-t]{min-width:4.2em;text-align:right}
button.r{width:100%;background:none;border:0;border-top:1px solid var(--ln);text-align:left;transition:background .2s}
button.r:active{background:var(--s2)}
.r input[type=text],.r input[type=password],.r input[type=number],.r select{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;text-align:right;-webkit-appearance:none;appearance:none}
.r input[type=range]{flex:1;min-width:0}
input[type=range]{-webkit-appearance:none;appearance:none;height:30px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--ac) var(--p,0%),var(--s2) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--s2)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--ac)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff}
.sw{margin-left:auto;flex:none;width:51px;height:31px;border-radius:16px;border:0;background:var(--s2);position:relative;transition:background .25s}
.sw i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .3s cubic-bezier(.3,1.5,.5,1),width .2s}
.sw.on{background:var(--ac)}
.sw.on i{transform:translateX(20px)}
.sw:active i{width:33px}
.sw.on:active i{transform:translateX(14px)}
.bt{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-weight:600;font-size:17px;background:var(--ac);color:var(--on);transition:transform .15s}
.bt:active{transform:scale(.97)}
.bt.gh{background:var(--s1);color:var(--tx)}
.bt.rd{background:var(--rd);color:#fff}
.bt+.bt{margin-top:10px}
.nt{border-left:3px solid var(--ac);padding:2px 0 2px 12px;color:var(--sb);font-size:14px;margin:0 4px 18px}
.seg{display:flex;background:var(--s1);border-radius:12px;padding:3px;margin-bottom:22px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;transition:background .25s}
.seg button.on{background:var(--s2);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.ft{text-align:center;color:var(--sb);font-size:13px}
.col{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1)}
.col.open{grid-template-rows:1fr}
.col>div{overflow:hidden;min-height:0}
.stg{display:none}
.stg.show{display:block;animation:in .4s}
.hero{display:flex;flex-direction:column;align-items:center;padding:4px 0 22px;text-align:center}
#tm{font-size:54px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;margin-top:18px}
#dt{color:var(--sb);margin-top:6px}
#dt::first-letter{text-transform:uppercase}
.hc{display:flex;justify-content:center;width:100%}
.clk{width:min(58vw,220px);height:auto;overflow:visible;filter:drop-shadow(0 16px 22px rgba(0,0,0,.35))}
.w1{fill:var(--wood)}.w2{fill:var(--wood2)}.acf{fill:var(--ac)}.acs{stroke:var(--ac)}.bf{fill:var(--rd)}
.fc{fill:var(--face);stroke:var(--wood2);stroke-width:5}
.ink{stroke:#2A1A0C}
.pd{transform-origin:100px 216px;animation:sw 2s ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(-11deg)}to{transform:rotate(11deg)}}
.dl,.dr,.bi,.bub{transition:transform .38s cubic-bezier(.3,1.4,.5,1),opacity .3s}
.dl{transform-origin:80px 68px}.dr{transform-origin:120px 68px}
.bi{transform-origin:100px 72px}
.bub{opacity:0;transform:scale(.5);transform-origin:128px 34px}
.open .dl,.open .dr{transform:scaleX(.06)}
.open .bi{transform:translateY(-8px) scale(1.4)}
.open .bub{opacity:1;transform:none}
.clk.open{animation:shk .5s}
@keyframes shk{25%{transform:rotate(-2.5deg)}60%{transform:rotate(2deg)}}
.ps{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -16px 22px;padding:2px 16px;scrollbar-width:none}
.ps::-webkit-scrollbar{display:none}
.ps button{flex:none;scroll-snap-align:start;min-width:132px;text-align:left;padding:12px 14px;border-radius:16px;border:1.5px solid var(--ln);background:var(--s1);transition:border-color .25s,background .25s,transform .15s}
.ps button:active{transform:scale(.96)}
.ps button.on{border-color:var(--ac);background:var(--s2)}
.ps small{display:block;color:var(--sb);font-size:12px}
.ps.tp button{min-width:76px;text-align:center}
.eq{display:flex;align-items:flex-end;justify-content:center;gap:12px;height:76px;margin:16px 0 8px}
.eq i{width:28px;border-radius:9px 9px 4px 4px;background:var(--ac);height:var(--h,40%);transform-origin:bottom;transition:height .4s cubic-bezier(.3,1.4,.5,1)}
.eq.play i{animation:bp .55s ease-in-out both}
.eq i:nth-child(2){animation-delay:.3s}.eq i:nth-child(3){animation-delay:.6s}.eq i:nth-child(4){animation-delay:.9s}
@keyframes bp{40%{transform:scaleY(1.22);filter:brightness(1.35)}}
nav{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(500px,calc(100% - 20px));display:flex;padding:6px;border-radius:26px;background:var(--nv);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--ln);z-index:20}
nav button{flex:1;position:relative;z-index:1;background:none;border:0;color:var(--sb);padding:8px 0 6px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .25s}
nav button.on{color:var(--ac)}
nav svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:20px;background:var(--s2);transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
#sv{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,40px) scale(.9);opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.3,1.4,.5,1),opacity .25s;background:var(--tx);color:var(--bg);padding:8px 8px 8px 18px;border-radius:30px;display:flex;gap:14px;align-items:center;font-size:15px;z-index:19;white-space:nowrap}
#sv.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#sv button{border:0;border-radius:20px;background:var(--ac);color:var(--on);font-weight:600;padding:8px 16px}
#ts{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-110px);background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:24px;font-size:15px;font-weight:500;z-index:80;transition:transform .5s cubic-bezier(.3,1.4,.5,1);max-width:calc(100% - 32px);text-align:center}
#ts.on{transform:translate(-50%,0)}
#ts.er{background:var(--rd);color:#fff}
#sh{position:fixed;inset:0;z-index:40;pointer-events:none}
#sh.on{pointer-events:auto}
#sh .bk{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s}
#sh.on .bk{opacity:1}
#sh .pn{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--s1);border-radius:26px 26px 0 0;padding:24px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.9,.2,1)}
#sh.on .pn{transform:none}
#sh h3{margin:0 0 6px;font-size:20px}
#sh p{color:var(--sb);margin-bottom:18px}
#rb{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:30px}
#rb.on{display:flex;animation:in .4s}
#rb i{width:46px;height:46px;border-radius:50%;border:4px solid var(--s2);border-top-color:var(--ac);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#ob{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;transition:opacity .5s,transform .6s cubic-bezier(.7,0,.2,1)}
#ob[hidden]{display:none}
#ob.out{opacity:0;transform:translateY(30px) scale(.98);pointer-events:none}
#obs{position:absolute;top:calc(14px + env(safe-area-inset-top));right:18px;background:none;border:0;color:var(--sb);padding:8px;z-index:2}
#stp{flex:1;position:relative;overflow:hidden;width:100%;max-width:520px;margin:0 auto}
.st{position:absolute;inset:0;padding:calc(50px + env(safe-area-inset-top)) 22px 16px;overflow:auto;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0;transform:translateX(60px);transition:opacity .5s,transform .55s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.st.on{opacity:1;transform:none;pointer-events:auto}
.st.pv{transform:translateX(-60px)}
.st .g,.st .ps{width:100%}
.st .ps{margin:0 0 18px;padding:2px 0}
#ob .clk{width:min(66vw,250px)}
#gr{font-size:50px;font-weight:700;letter-spacing:-.03em;line-height:1.2;margin:18px 0 6px;transition:opacity .38s,transform .38s}
#gr.f{opacity:0;transform:translateY(12px)}
#obf{width:100%;max-width:520px;margin:0 auto;padding:12px 22px calc(18px + env(safe-area-inset-bottom))}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--s2);transition:width .4s cubic-bezier(.3,1.4,.5,1),background .3s}
.dots i.on{width:24px;background:var(--ac)}
.c1,.c2{fill:none;stroke:var(--ac);stroke-linecap:round;stroke-linejoin:round}
.c1{stroke-width:3;stroke-dasharray:151;stroke-dashoffset:151}
.c2{stroke-width:3.5;stroke-dasharray:40;stroke-dashoffset:40}
.st.on .c1{animation:dr .8s .25s cubic-bezier(.5,0,.2,1) forwards}
.st.on .c2{animation:dr .4s .95s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

    <b data-i="ap1"></b><br>

<script>
let S = {};
const $=(q,e=document)=>e.querySelector(q),$$=(q,e=document)=>[...e.querySelectorAll(q)];

const buzz=()=>navigator.vibrate&&navigator.vibrate(8);
const fmt=k=>k=='volume'?Math.round(S.volume/10.23)+' %':(k[0]=='b'&&k.length==2)?S[k]+' Hz':k=='host'?'http://'+S.host+'.local':S[k];

function set(k,v){if(S[k]===v)return;S[k]=v;if(SK.includes(k))dirty=true;sync()}

function sync(){
    $$('[data-k]').forEach(e=>{const k=e.dataset.k,v=S[k];
    if(e.classList.contains('sw')){e.classList.toggle('on',!!v);e.setAttribute('aria-checked',!!v)}
    else{if(String(e.value)!==String(v))e.value=v;if(e.type=='range')e.style.setProperty('--p',(v-e.min)/(e.max-e.min)*100+'%')}});

    // Toggle AP Mode banners visibility
    $$('.ap-banner').forEach(b=>b.style.display=S.ap_mode?'block':'none');

    $$('[data-t]').forEach(e=>e.textContent=fmt(e.dataset.t));
    $$('[data-n]').forEach(e=>e.textContent=tr('night_range',pad(S.ns),pad(S.ne)));
    $$('.col').forEach(e=>e.classList.toggle('open',!!S.night));
    $$('.eq').forEach(q=>$$('i',q).forEach((b,i)=>b.style.setProperty('--h',Math.max(14,Math.min(100,S['b'+(i+1)]/15))+'%')));
    const c=[S.b1,S.b2,S.b3,S.b4].join();
    $$('[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p==c));
    $('#sv').classList.toggle('on',dirty&&!inOb);
    nx();
}

function nx(){
const e=$('#nx'),d=new Date();let t=new Date(d);t.setSeconds(0,0);
for(let i=0;i<2900;i++){
t=new Date(t.getTime()+6e4);const m=t.getMinutes(),h=t.getHours();
if(m&&!(m==30&&S.half))continue;
if(S.night&&(S.ns>S.ne?(h>=S.ns||h<S.ne):(h>=S.ns&&h<S.ne)))continue;
const mn=Math.round((t-d)/6e4);e.textContent=mn<60?tr('nx_in',mn):tr('nx_at',pad(h)+':'+pad(m));return}
e.textContent='—'}

function tick(){
const d=new Date(),s=d.getSeconds(),m=d.getMinutes(),h=d.getHours();
const rot=(c,a)=>$$(c).forEach(e=>e.setAttribute('transform','rotate('+a+' 100 152)'));
rot('.hh',(h%12)*30+m/2);rot('.mh',m*6+s/10);rot('.sh',s*6);
$('#tm').textContent=pad(h)+':'+pad(m);
$('#dt').textContent=d.toLocaleDateString(L=='fr'?'fr-FR':'en-GB',{weekday:'long',day:'numeric',month:'long'});
if(s==0)nx()}
setInterval(tick,1000);tick();

function cuckoo(){buzz();$$('.clk').forEach(c=>{c.classList.remove('open');void c.getBoundingClientRect();c.classList.add('open');clearTimeout(c._t);c._t=setTimeout(()=>c.classList.remove('open'),2800)})}

function toast(m,err){const t=$('#ts');t.textContent=m;t.className='on'+(err?' er':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',2400)}
async function call(path,q){try{const r=await fetch(path+(q?'?'+new URLSearchParams(q):''));if(!r.ok)throw 0;return r}catch(e){toast(tr('err_offline'),1);return null}}
function ask(t,s,l,f,red){$('#sh-t').textContent=t;$('#sh-s').textContent=s;const b=$('#sh-ok');b.textContent=l;b.className='bt'+(red?' rd':'');b.onclick=()=>{shut();f()};$('#sh').classList.add('on')}
function shut(){$('#sh').classList.remove('on')}

function go(i){document.documentElement.style.setProperty('--d',i>cur?1:-1);cur=i;$$('.scr').forEach((s,j)=>s.classList.toggle('on',j==i));$$('nav button').forEach((b,j)=>b.classList.toggle('on',j==i));$('#ind').style.transform='translateX('+i*100+'%)';scrollTo(0,0)}

function theme(p){ST.s('cuckoo_th',p);const l=p=='l'||(p=='auto'&&matchMedia('(prefers-color-scheme:light)').matches);document.documentElement.classList.toggle('l',l);$$('#th button').forEach(b=>b.classList.toggle('on',b.dataset.v==p))}

const OB=$('#ob'),W=['Coucou','Hello','Hola','Bonjour','Ciao','Hallo','こんにちは','Olá'];
function greet(){const g=$('#gr');g.classList.add('f');setTimeout(()=>{gi=(gi+1)%W.length;g.textContent=W[gi];g.classList.remove('f')},380)}

function obStart(){OB.hidden=false;OB.classList.remove('out');inOb=true;obShow(0);clearInterval(gt);gt=setInterval(greet,2100);setTimeout(cuckoo,1000);sync()}

/* ---------- Minuteur / Timer ---------- */
let tmrEnd=0;
function tmrUI(){const b=$('#tbt');if(!b)return;b.textContent=tr(tmrEnd?'tm_cancel':'tm_start');b.style.color=tmrEnd?'var(--rd)':''}
function tmrTick(){
const left=tmrEnd?Math.max(0,Math.round((tmrEnd-Date.now())/1000)):0;
if(tmrEnd&&left==0){tmrEnd=0;toast(tr('tm_done'))}
const h=Math.floor(left/3600),m=Math.floor(left%3600/60),s=left%60;
$('#tl').textContent=tmrEnd?(h?h+':'+pad(m):pad(m))+':'+pad(s):'—';
tmrUI()}
async function tmrSync(){try{const r=await fetch('/timer',{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();tmrEnd=j.left>0?Date.now()+j.left*1000:0;tmrTick()}catch(e){}}
setInterval(tmrTick,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tmrSync()});

const act={
coucou:async()=>{cuckoo();await call('/coucou')},
hold_out:async()=>{if(await call('/cuckoo_out')){$$('.clk').forEach(c=>{clearTimeout(c._t);c.classList.add('open')});toast(tr('t_out'))}},
pull_in:async()=>{if(await call('/cuckoo_in')){$$('.clk').forEach(c=>{clearTimeout(c._t);c.classList.remove('open')});toast(tr('t_in'))}},
tpre:a=>{$('#tmin').value=a.dataset.v},
timer:async()=>{
 if(tmrEnd){if(await call('/timer',{min:0})){tmrEnd=0;tmrTick();toast(tr('tm_cancelled'))}return}
 const m=Math.max(1,Math.min(600,parseInt($('#tmin').value)||10));
 $('#tmin').value=m;
 const r=await call('/timer',{min:m});
 if(r){let left=m*60;try{const j=await r.json();if(j.left>0)left=j.left}catch(e){}tmrEnd=Date.now()+left*1000;tmrTick();toast(tr('tm_set',m))}
},
starwars:async()=>{if(await call('/starwars'))toast(tr('force'))},
test:async()=>{$$('.eq').forEach(q=>{q.classList.remove('play');void q.offsetWidth;q.classList.add('play')});await call('/test',{b1:S.b1,b2:S.b2,b3:S.b3,b4:S.b4,volume:S.volume})},
save:async()=>{const q={};SK.forEach(k=>q[k]=S[k]);if(!await call('/set',q))return false;dirty=false;sync();toast(tr('saved'));return true},
wifi:async()=>{if(await call('/setwifi',{ssid:S.ssid,password:S.password}))ask(tr('wifi_saved_t'),tr('wifi_saved_s'),tr('reboot_now'),act.reboot)},
settime:async()=>{if(await call('/settime',{t:Math.floor(Date.now()/1e3),tz:-new Date().getTimezoneOffset()}))toast(tr('time_sent'))},
copy:a=>{const v=a.dataset.v=='host'?'http://'+S.host+'.local':a.dataset.v;const t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();let ok=0;try{ok=document.execCommand('copy')}catch(e){}t.remove();toast(ok?tr('copied'):v)},
eye:()=>{const p=$('#pw');p.type=p.type=='password'?'text':'password';eyeTxt()},
th:a=>theme(a.dataset.v),
lg:a=>lang(a.dataset.v),

rebootask:()=>ask(tr('rb_ask_t'),tr('rb_ask_s'),tr('rb_ask_ok'),act.reboot,1),
reboot:async()=>{fetch('/reboot').catch(()=>{});$('#rb').classList.add('on');await new Promise(r=>setTimeout(r,4000));for(let i=0;i<30;i++){try{const r=await fetch('/',{cache:'no-store'});if(r.ok)break}catch(e){}await new Promise(r=>setTimeout(r,2000))}location.reload()},

document.addEventListener('click',e=>{const t=e.target;let x;
if(x=t.closest('.sw')){set(x.dataset.k,S[x.dataset.k]?0:1);buzz()}
else if(x=t.closest('[data-p]')){x.dataset.p.split(',').forEach((v,i)=>S['b'+(i+1)]=+v);dirty=true;sync();buzz()}
else if(x=t.closest('[data-tab]'))go(+x.dataset.tab);
else if(x=t.closest('[data-a]')){buzz();act[x.dataset.a](x)}
else if(t.closest('.clk'))cuckoo()});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(k&&!t.classList.contains('sw'))set(k,(k=='ssid'||k=='password')?t.value:+t.value)});

async function stat(){try{const r=await fetch('/status',{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();$('#stg').classList.add('show');
$('#s-t').textContent=j.time||'—';
$('#s-w').textContent=j.temp!=null?j.temp+' °C':'—';
$('#s-h').textContent=j.hum!=null?j.hum+' %':'—';
$('#s-c').textContent=j.cpu!=null?j.cpu+' °C':'—';
$('#s-r').textContent=j.rssi!=null?tr(j.rssi>-60?'rssi_ex':j.rssi>-75?'rssi_ok':'rssi_weak')+' ('+j.rssi+' dBm)':'—';
$('#s-u').textContent=j.up!=null?(j.up>=3600?Math.floor(j.up/3600)+' h '+pad(Math.floor(j.up%3600/60)):Math.floor(j.up/60)+' min'):'—';
$('#s-total').textContent=j.total != null ? j.total.toLocaleString() : '—';
$('#s-dist').textContent=j.distance_km != null ? j.distance_km + ' km' : '—';

setTimeout(stat,10000)}catch(e){}}

async function loadConfig() {
    try {
        const r = await fetch('/config');
        S = await r.json();
        sync();
        stat();
        tmrSync();
        if(!ST.g('cuckoo_ob')) obStart();
    } catch(e) {
        toast(tr('cfg_err'), 1);
    }
}

lang(ST.g('cuckoo_lang')||'auto');
loadConfig();
</script>
